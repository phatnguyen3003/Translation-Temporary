[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-translate"
version = "0.1.0"
description = "Lightweight Vietnamese-to-Any-Language translator running strictly beneath 512MB RAM"
authors = [{ name = "Auto_Translate Team" }]
dependencies = [
    "ctranslate2>=4.0.0",
    "sentencepiece>=0.2.0",
    "huggingface-hub>=0.20.0",
    "psutil>=5.9.0"
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
auto-translate = "auto_translate.cli:main"
