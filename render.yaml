# Render Blueprint Specification
# See: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: auto-translate-api
    env: python
    plan: free
    region: singapore # Options: singapore, oregon, frankfurt, ohio
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.auto_translate.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: OMP_NUM_THREADS
        value: "2"
      - key: BEAM_SIZE
        value: "4"
      - key: COMPUTE_TYPE
        value: "int8"
      - key: MAX_CONCURRENCY
        value: "20"
      - key: MAX_ALLOWED_RAM_MB
        value: "512.0"
