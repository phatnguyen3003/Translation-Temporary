# Render Blueprint Specification for Docker Deployment
# See: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: auto-translate-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore # Options: singapore, oregon, frankfurt, ohio
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: OMP_NUM_THREADS
        value: "1"
      - key: BEAM_SIZE
        value: "1"
      - key: COMPUTE_TYPE
        value: "int8"
      - key: MAX_CONCURRENCY
        value: "20"
      - key: MAX_ALLOWED_RAM_MB
        value: "512.0"
